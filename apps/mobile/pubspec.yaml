name: storykeep
description: "Storykeep mobile app: a relationship-centered memory platform."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # REST client (and MockClient for tests); http_parser for multipart media types.
  http: ^1.6.0
  http_parser: ^4.1.2
  # Dependency injection of the API client and the auth ChangeNotifier.
  provider: ^6.1.5+1
  # Declarative routing with an auth redirect.
  go_router: ^18.0.2
  # Bearer token in the Android Keystore / iOS Keychain.
  flutter_secure_storage: ^11.2.0
  # Photos/videos from the gallery or camera.
  image_picker: ^1.2.3
  # Any file (e.g. PDFs) from the device.
  file_picker: ^13.1.0
  # Temporary directory for downloaded media, and opening it in another app.
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  # 2.3+ is built on package:jni, which needs an NDK version the read-only Nix
  # Android SDK doesn't ship. 2.2 has the same API without native code.
  path_provider_android: '>=2.2.0 <2.3.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
