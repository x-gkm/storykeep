[package]
name = "storykeep-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
futures-util = "0.3.34"
hex = "0.4.3"
rand = "0.10.3"
rust_decimal = { version = "1.43.0", features = ["serde-with-float"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "chrono", "rust_decimal", "uuid"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.27.0", features = ["v4", "serde"] }
warp = { version = "0.4.3", features = ["server", "multipart"] }


[dev-dependencies]
warp = { version = "0.4.3", features = ["test"] }
